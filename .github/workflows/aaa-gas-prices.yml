name: AAA national average

on:
  schedule:
    # 13:00 UTC daily = 9am ET in summer, 8am ET in winter. AAA posts the new
    # national average early each morning ET.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite today's row if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aaa-gas-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt

      - name: Install dependencies
        env:
          SHEET_ID: ${{ vars.AAA_SHEET_ID }}
        run: |
          if [ -n "$SHEET_ID" ]; then
            pip install -r scraper/requirements-sheets.txt
          else
            pip install -r scraper/requirements.txt
          fi

      - name: Run tests
        run: python -m unittest discover -s scraper/tests

      - name: Scrape today's national average
        env:
          AAA_SHEET_ID: ${{ vars.AAA_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scraper/aaa_gas_prices.py \
            --out data/aaa_national_average.csv \
            ${{ inputs.force && '--force' || '' }}

      - name: Commit the new row
        run: |
          if [ -z "$(git status --porcelain data/aaa_national_average.csv)" ]; then
            echo "No change — already have today's reading."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aaa_national_average.csv
          git commit -m "data: AAA national average for $(date -u +%F)"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
          done
          exit 1
